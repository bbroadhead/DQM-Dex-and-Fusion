name: Validate Caravan Heart data
on:
  push:
    paths:
      - 'data/woodus/dqm3gba-*.json'
      - 'scripts/validate_caravan_data.py'
      - 'scripts/import_caravan_stats.py'
      - 'scripts/test_caravan_stats_parser.py'
      - 'scripts/test_caravan_ui.py'
      - 'index.html'
      - '.github/workflows/validate-caravan-data.yml'
  pull_request:
    paths:
      - 'data/woodus/dqm3gba-*.json'
      - 'scripts/validate_caravan_data.py'
      - 'scripts/test_caravan_ui.py'
      - 'scripts/test_caravan_stats_parser.py'
      - 'index.html'
      - '.github/workflows/validate-caravan-data.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Caravan Heart FAQ parsing
        run: python scripts/test_caravan_stats_parser.py
      - name: Check Caravan Heart browser JavaScript and UI
        run: python scripts/test_caravan_ui.py
      - name: Validate monster roster, stat records, and reform recipes
        run: python scripts/validate_caravan_data.py
