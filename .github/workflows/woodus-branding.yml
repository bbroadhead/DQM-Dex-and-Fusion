name: Import game logos and family icons
on:
  workflow_dispatch:
    inputs:
      game:
        description: "Game"
        type: choice
        default: all
        options:
          - all
          - dwm1gbc
          - dwm2gbc
permissions:
  contents: write
concurrency:
  group: woodus-branding-import
  cancel-in-progress: false
jobs:
  branding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover labeled logos and family icons
        run: python scripts/woodus_branding.py --game "${{ inputs.game }}"
      - name: Commit verified image assets
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/branding/ data/woodus/branding-import-report.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Import verified game logos and family icons"
            git push origin HEAD:main
          fi
