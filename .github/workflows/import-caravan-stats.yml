name: Import Caravan Heart star ranks and stats
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import and validate stat records
        run: python scripts/import_caravan_stats.py --source-file data/monster-faq.txt\n      - name: Validate imported data\n        run: python scripts/validate_caravan_data.py
      - name: Commit validated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/woodus/dqm3gba-details.json data/woodus/dqm3gba-stats-import-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Import Caravan Heart monster stars and growth stats"
            git push origin HEAD:main
          fi
