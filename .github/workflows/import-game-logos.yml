name: Import official game logos from wiki gallery
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 Pillow
      - name: Download and validate game logos
        run: python scripts/import_game_logos.py
      - name: Commit logos and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/branding/manifest.json assets/branding/
          git diff --cached --quiet || (git commit -m "Import verified game logo gallery images" && git push origin HEAD:main)
