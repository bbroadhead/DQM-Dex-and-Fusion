name: Normalize breeding aliases and alternatives
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize source rows
        run: python scripts/woodus_normalize_breeding.py
      - name: Commit normalized breeding data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/woodus/*-breeding-normalized.json
          git diff --cached --quiet || (git commit -m "Normalize Woodus breeding aliases and alternatives" && git push origin HEAD:main)
