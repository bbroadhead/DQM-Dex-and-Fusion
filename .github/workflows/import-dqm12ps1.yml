name: Import DQM 1+2 PS1 monsters and sprites
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify PS1 roster parser
        run: python scripts/test_dqm12ps1_import.py
      - name: Import PS1 roster and PS1-specific artwork
        run: python scripts/import_dqm12ps1.py
      - name: Upload source diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ps1-import-diagnostics
          path: import-diagnostics/
          if-no-files-found: warn
      - name: Validate imported PS1 roster and images
        run: python scripts/validate_dqm12ps1.py
      - name: Commit imported data and artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/woodus/dqm12ps1-*.json assets/monsters/dqm12ps1/
          if ! git diff --cached --quiet; then
            git commit -m "Import PS1 DQM 1+2 monster data and images"
            git push
          fi
