name: Import monster families and representative icons
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: woodus-family-import
  cancel-in-progress: false
jobs:
  families:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import verified family membership
        run: python scripts/woodus_families.py
      - name: Commit family data and icon mappings
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/woodus/*-monsters.json data/woodus/family-import-report.json assets/branding/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Import monster families and representative icons"
            git push origin HEAD:main
          fi
