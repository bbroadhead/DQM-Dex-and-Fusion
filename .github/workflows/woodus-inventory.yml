name: Woodus source inventory
on:
  workflow_dispatch:
    inputs:
      game:
        description: "Which game to inventory"
        required: true
        default: all
        type: choice
        options:
          - all
          - dwm1gbc
          - dwm2gbc
      batch_size:
        description: "New monster detail pages per selected game (1-10)"
        required: true
        default: '5'
        type: choice
        options:
          - '5'
          - '10'
          - '1'

permissions:
  contents: write

concurrency:
  group: woodus-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory Woodus pages
        run: python scripts/woodus_inventory.py --game "${{ inputs.game }}"
      - name: Normalize monster image references
        run: python scripts/woodus_normalize.py --game "${{ inputs.game }}"
      - name: Attach monster detail links
        run: python scripts/woodus_detail_links.py --game "${{ inputs.game }}"
      - name: Sample monster detail page structure
        run: python scripts/woodus_detail_sample.py --game "${{ inputs.game }}"
      - name: Import a small batch of monster details
        run: python scripts/woodus_detail_batch.py --game "${{ inputs.game }}" --batch-size "${{ inputs.batch_size }}"
      - name: Validate imported monster details
        run: python scripts/woodus_validate.py --game "${{ inputs.game }}"
      - name: Extract breeding table candidates
        run: python scripts/woodus_breeding.py --game "${{ inputs.game }}"
      - name: Commit inventory and monster manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/woodus/*-inventory.json data/woodus/*-monsters.json data/woodus/*-breeding-candidates.json data/woodus/*-detail-sample.json data/woodus/*-details.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Woodus monster and breeding candidates"
            git push origin HEAD:main
          fi
      - name: Upload data backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woodus-data
          path: data/woodus/
          retention-days: 7
          if-no-files-found: warn
