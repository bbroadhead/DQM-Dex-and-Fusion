<header class="site-header"><div class="header-eyebrow">DRAGON QUEST MONSTERS</div><h1><span>ROSTER</span><span class="header-amp">&</span><span>FUSION</span></h1><div class="header-rule" aria-hidden="true"><i></i><b>◆</b><i></i></div></header>
<main><nav class="games" id="games" aria-label="Select game"></nav><nav class="tabs" aria-label="Tools"><button data-tab="roster" aria-selected="true">Roster</button><button data-tab="fusion" aria-selected="false">Fusion</button></nav><section class="panel" id="panel" aria-live="polite"></section></main>
<script>
const games=[
{id:"dwm",name:"Dragon Warrior Monsters",year:1998,platform:"GBC",group:"Original"},
{id:"dwm2",name:"Dragon Warrior Monsters 2",subtitle:"Cobi's Journey / Tara's Adventure",year:2001,platform:"GBC",group:"Original"},
{id:"dqm12",name:"Dragon Quest Monsters 1+2",subtitle:"Terry / Cobi & Tara",year:2002,platform:"PS1",group:"Original",modes:["DQM1","DQM2"]},
{id:"caravan",name:"Caravan Heart",year:2003,platform:"GBA",group:"Caravan Heart"},
{id:"joker",name:"Joker",year:2006,platform:"DS",group:"Joker"},
{id:"joker2",name:"Joker 2",year:2010,platform:"DS",group:"Joker"},
{id:"joker2pro",name:"Joker 2 Professional",year:2011,platform:"DS",group:"Joker"},
{id:"terry3d",name:"Terry's Wonderland 3D",year:2012,platform:"3DS",group:"Remakes"},
{id:"dqm2-3d",name:"Iru & Luca's Marvelous Mysterious Key",year:2014,platform:"3DS",group:"Remakes"},
{id:"joker3",name:"Joker 3",year:2016,platform:"3DS",group:"Joker"},
{id:"joker3pro",name:"Joker 3 Professional",year:2017,platform:"3DS",group:"Joker"},
{id:"darkprince",name:"The Dark Prince",year:2023,platform:"Switch / PC",group:"Modern"},
{id:"witheredworld",name:"The Withered World",year:2026,platform:"Switch 2 / Switch / PS5 / Xbox / PC",group:"Modern"}];
let selected=games[0].id,tab="roster",monsters=[],recipes=[],mode="DQM1",fusionMode="explore",focusMonster="",partnerMonster="",targetMonster="",treeChoices={},expandedTree={},openFamilies={};
const importedGames={dwm:"dwm1gbc",dwm2:"dwm2gbc",caravan:"dqm3gba"};
const logoManifest="assets/branding/manifest.json";let branding={games:{},families:{}};let caravanReform={recipes:[]};let caravanGeneral={stars:{}};
async function loadBranding(){try{const r=await fetch(logoManifest);if(r.ok)branding=await r.json()}catch(e){}render()}
function imageMarkup(src,cls,alt){return src?'<img class="'+cls+'" src="'+escapeHTML(src)+'" alt="'+escapeHTML(alt)+'" loading="lazy" onerror="this.hidden=true">':''}
function familyIcon(family){const key=String(family||"").toLowerCase();const path=branding.families?.[importedGames[selected]]?.[key];return imageMarkup(path,"family-icon",family+" family")}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function game(){return games.find(g=>g.id===selected)}
function render(){document.body.dataset.theme=selected;document.querySelector("#games").innerHTML=games.map(g=>'<button class="game" data-game="'+g.id+'" aria-pressed="'+(g.id===selected)+'" data-has-logo="'+!!branding.games?.[g.id]+'">'+'<span class="game-artwork">'+(branding.games?.[g.id]?imageMarkup(branding.games[g.id],"game-logo",g.name+" logo"):"")+'</span>'+'<span class="game-title">'+escapeHTML(g.name)+'</span>'+(g.subtitle?'<small>'+escapeHTML(g.subtitle)+'</small>':'')+'<small>'+g.year+' · '+g.platform+'</small></button>').join("");document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));renderPanel()}
function modeSelector(){return game().modes?'<label for="mode">Collection game</label><select id="mode">'+game().modes.map(m=>'<option value="'+m+'" '+(mode===m?'selected':'')+'>'+m+'</option>').join("")+'</select>':''}
function activeMonsters(){return monsters.filter(m=>!game().modes||!m.mode||m.mode===mode)}
function activeRecipes(){return recipes.filter(r=>!game().modes||!r.mode||r.mode===mode)}
function bindMode(){const el=document.querySelector("#mode");if(el)el.addEventListener("change",()=>{mode=el.value;renderPanel()})}
function renderPanel(){const p=document.querySelector("#panel");if(tab==="roster"){p.innerHTML='<h2>'+escapeHTML(game().name)+' · Monster Roster</h2>'+modeSelector()+'<label for="search">Search monsters</label><input id="search" type="search" placeholder="Name, number, or family"><div id="entries"></div>';document.querySelector("#search").addEventListener("input",showEntries);bindMode();showEntries()}else{renderFusionPanel()}}
function monsterOptions(value,obtainableOnly=false){return '<option value="">Choose a monster</option>'+activeMonsters().filter(m=>!obtainableOnly||m.obtainable!==false).slice().sort((a,b)=>a.name.localeCompare(b.name)).map(m=>'<option value="'+escapeHTML(m.id)+'" '+(value===m.id?'selected':'')+'>'+escapeHTML(m.name)+'</option>').join("")}
function byId(id){return activeMonsters().find(m=>m.id===id)}
function parentMatches(spec,m){return !!m&&(spec.kind==="monster"&&spec.id===m.id||spec.kind==="family"&&String(spec.family).toLowerCase()===String(m.family).toLowerCase()||spec.kind==="alternatives"&&spec.options.some(o=>o.id===m.id))}
function parentLabel(spec){if(spec.kind==="monster"){const m=byId(spec.id);return (m?.name||spec.label)+(spec.minimum_plus!=null?' +'+spec.minimum_plus:'')}if(spec.kind==="family")return "Any "+spec.family+" family";if(spec.kind==="alternatives")return spec.options.map(o=>byId(o.id)?.name||o.source_label).join(" / ");return spec.label||"Unknown"}
function parentCandidates(spec){if(spec.kind==="monster")return byId(spec.id)?[byId(spec.id)]:[];if(spec.kind==="family")return activeMonsters().filter(m=>String(m.family).toLowerCase()===String(spec.family).toLowerCase());if(spec.kind==="alternatives")return spec.options.map(o=>byId(o.id)).filter(Boolean);return []}
function availableRecipes(){return activeRecipes().filter(r=>r.breeding_available!==false&&r.offspring?.kind==="monster"&&byId(r.offspring.id)&&["monster","family","alternatives"].includes(r.parent1?.kind)&&["monster","family","alternatives"].includes(r.parent2?.kind))}
function recipeText(r){return parentLabel(r.parent1)+" × "+parentLabel(r.parent2)}
function recipeKey(r){return String(r.source_row_index)+"-"+r.offspring.id}
function renderCaravanReform(){
 const p=document.querySelector("#panel");
 p.innerHTML='<h2>'+escapeHTML(game().name)+' · Reform Explorer</h2><p class="muted">Caravan Heart uses one existing monster and two monster hearts. Select all three ingredients to explore the reform process.</p><div class="reform-inputs"><label for="reformBase">Base monster</label><select id="reformBase">'+monsterOptions("",true)+'</select><label for="reformPlus">Base monster + level</label><input id="reformPlus" type="number" min="0" max="999" value="0"><label for="reformHeart1">First monster heart</label><select id="reformHeart1">'+monsterOptions("",true)+'</select><label for="reformHeart2">Second monster heart</label><select id="reformHeart2">'+monsterOptions("",true)+'</select></div><div id="reformResult" aria-live="polite"></div><p class="muted">Reform depends on species, families, ranks, and sometimes the base monster’s plus level. Only verified combinations will be displayed as confirmed results.</p>';
 const reverse=document.createElement("section");
 reverse.innerHTML='<h3>Find a Reform recipe</h3><label for="reformTarget">Desired monster</label><select id="reformTarget">'+monsterOptions("")+'</select><div id="reformReverse" aria-live="polite"></div>';
 p.appendChild(reverse);
 const reference=document.createElement("section");
 const familyNames=["Beast","Demon","Material","Animal","Slime","Nature","Elemental"];
 const tables=caravanGeneral.stars||{};
 if(Object.keys(tables).length){
  reference.innerHTML='<details><summary>General Reform charts (1–5 stars)</summary><p class="muted">Columns: dominant family. Rows: influencing family. Source: Slartifer Monster FAQ §1.2. Special recipes and double-heart rules override general results.</p><label for="reformChartStars">Star level</label><select id="reformChartStars">'+[1,2,3,4,5].map(n=>'<option value="'+n+'">'+n+' star'+(n>1?'s':'')+'</option>').join('')+'</select><div id="reformChartTable" style="overflow-x:auto"></div></details>';
  p.appendChild(reference);
  const chartSelect=document.getElementById("reformChartStars");
  const chartOutput=document.getElementById("reformChartTable");
  const drawChart=()=>{
   const table=tables[chartSelect.value]||{};
   chartOutput.innerHTML='<table><thead><tr><th>Influencing / Dominant</th>'+familyNames.map(n=>'<th>'+n+'</th>').join('')+'</tr></thead><tbody>'+familyNames.map(influence=>'<tr><th>'+escapeHTML(influence)+'</th>'+familyNames.map(dominant=>{
    const m=byId(table[influence]?.[dominant]);
    return '<td>'+(m?escapeHTML(m.name):'<span class="muted">Unresolved</span>')+'</td>';
   }).join('')+'</tr>').join('')+'</tbody></table>';
  };
  chartSelect.addEventListener("change",drawChart);drawChart();
 }
 const targetSelect=document.getElementById("reformTarget");
 const renderReverse=()=>{
  const target=byId(targetSelect.value),el=document.getElementById("reformReverse");
  if(!target){el.innerHTML='<p class="muted">Choose a monster to see known special reform combinations.</p>';return}

 const selectors=["reformBase","reformHeart1","reformHeart2"].map(id=>document.getElementById(id));

  }
