<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DQM Dex & Fusion</title><meta name="theme-color" content="#10182a">
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c1220;color:#f0f4ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#263b64,#0c1220 55%);min-height:100vh}header,main{max-width:1200px;margin:auto;padding:22px}header{text-align:center}h1{margin:12px 0 5px;font-size:clamp(1.6rem,4vw,2.8rem)}p{color:#aebcda}.games{display:flex;gap:12px;overflow:auto;padding:14px 4px 24px;scroll-snap-type:x mandatory}.game{flex:0 0 175px;min-height:110px;border:1px solid #45587d;border-radius:14px;background:#17233a;color:#dce6ff;padding:15px;cursor:pointer;scroll-snap-align:start}.game[aria-pressed=true]{background:#30466d;border-color:#ffd676;color:white;box-shadow:0 0 0 2px #ffd67633}.game strong{display:block;font-size:.95rem}.game small{display:block;margin-top:8px;color:#b4c2df}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.tabs button,.action{background:#1c2c4b;border:1px solid #526991;border-radius:9px;padding:12px 20px;color:white;cursor:pointer}.tabs button[aria-selected=true]{background:#385a8e;border-color:#ffd676}.panel{background:#141f34;border:1px solid #334765;border-radius:16px;padding:24px;min-height:300px}label{display:block;margin:15px 0 6px}input,select{width:100%;background:#0d1729;color:white;border:1px solid #4b638a;border-radius:8px;padding:12px}.fusion{display:grid;grid-template-columns:1fr 1fr;gap:18px}.fusion .result{grid-column:1/-1;border:1px dashed #526991;padding:18px;border-radius:12px;text-align:center}.muted{color:#aebcda}.tag{display:inline-block;background:#293e5e;padding:4px 9px;border-radius:8px;margin:4px}.empty{text-align:center;padding:45px 10px;color:#c1cce2}@media(max-width:600px){.fusion{grid-template-columns:1fr}.fusion .result{grid-column:auto}.game{flex-basis:145px}header,main{padding:14px}}
.game small+small{margin-top:3px}.game{min-height:125px}#entries article{border-bottom:1px solid #334765;padding:12px 0}#entries article h3{margin:0 0 7px}#entries article small{color:#b9c7e4;font-size:.8em}.games{flex-wrap:wrap;overflow:visible}.game{flex:1 1 160px;max-width:230px}.panel h2{margin-top:0}.game-logo{width:100%;height:54px;object-fit:contain;display:block;margin:0 auto 8px}.monster-entry{display:flex;align-items:center;gap:12px}.monster-sprite{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;flex:none}.family-icon{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:5px}.family-filter{max-width:260px}.monster-entry .details{min-width:0;flex:1}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffd676;outline-offset:3px}@media(max-width:600px){.games{flex-wrap:nowrap;overflow-x:auto}.game{flex:0 0 155px}} .breed-card{border:1px solid #334765;border-radius:12px;padding:14px;margin:12px 0;background:#192741}.breed-card a,.tree-node a{display:inline-block;margin-top:8px;color:#bcd9ff}.fusion-tabs{margin-top:20px}.tree-node{border:1px solid #405779;background:#1a2942;border-radius:12px;padding:12px;margin:10px 0;min-width:0}.tree-children{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.tree-node .monster-sprite{width:42px;height:42px}.tree-node .monster-entry{display:flex;gap:8px}.tree-node small{display:block;margin-top:8px}.tree-node label{font-size:.85rem}.tree-branch{min-width:0}@media(max-width:650px){.tree-children{grid-template-columns:1fr}.tree-node{padding:10px}} </style></head><body>
<header><h1>Dragon Quest Monsters Dex & Fusion</h1><p>Explore monsters and game-specific breeding or synthesis recipes.</p></header>
<main><nav class="games" id="games" aria-label="Select game"></nav><nav class="tabs" aria-label="Tools"><button data-tab="dex" aria-selected="true">Dex</button><button data-tab="fusion" aria-selected="false">Fusion</button></nav><section class="panel" id="panel" aria-live="polite"></section></main>
<script>
const games=[
{id:"dwm",name:"Dragon Warrior Monsters",year:1998,platform:"GBC",group:"Original"},
{id:"dwm2",name:"Dragon Warrior Monsters 2",subtitle:"Cobi's Journey / Tara's Adventure",year:2001,platform:"GBC",group:"Original"},
{id:"dqm12",name:"Dragon Quest Monsters 1+2",subtitle:"Terry / Cobi & Tara",year:2002,platform:"PS1",group:"Original",modes:["DQM1","DQM2"]},
{id:"caravan",name:"Caravan Heart",year:2003,platform:"GBA",group:"Caravan Heart"},
{id:"joker",name:"Joker",year:2006,platform:"DS",group:"Joker"},
{id:"joker2",name:"Joker 2",year:2010,platform:"DS",group:"Joker"},
{id:"joker2pro",name:"Joker 2 Professional",year:2011,platform:"DS",group:"Joker"},
{id:"terry3d",name:"Terry's Wonderland 3D",year:2012,platform:"3DS",group:"Remakes"},
{id:"dqm2-3d",name:"Iru & Luca's Marvelous Mysterious Key",year:2014,platform:"3DS",group:"Remakes"},
{id:"joker3",name:"Joker 3",year:2016,platform:"3DS",group:"Joker"},
{id:"joker3pro",name:"Joker 3 Professional",year:2017,platform:"3DS",group:"Joker"},
{id:"darkprince",name:"The Dark Prince",year:2023,platform:"Switch / PC",group:"Modern"}];
let selected=games[0].id,tab="dex",monsters=[],recipes=[],mode="DQM1",familyFilter="",fusionMode="explore",focusMonster="",partnerMonster="",targetMonster="",treeChoices={};
const importedGames={dwm:"dwm1gbc",dwm2:"dwm2gbc"};
const logoManifest="assets/branding/manifest.json";let branding={games:{},families:{}};
async function loadBranding(){try{const r=await fetch(logoManifest);if(r.ok)branding=await r.json()}catch(e){}render()}
function imageMarkup(src,cls,alt){return src?'<img class="'+cls+'" src="'+escapeHTML(src)+'" alt="'+escapeHTML(alt)+'" loading="lazy" onerror="this.hidden=true">':''}
function familyIcon(family){const key=String(family||"").toLowerCase();const path=branding.families?.[importedGames[selected]]?.[key];return imageMarkup(path,"family-icon",family+" family")}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function game(){return games.find(g=>g.id===selected)}
function render(){document.querySelector("#games").innerHTML=games.map(g=>'<button class="game" data-game="'+g.id+'" aria-pressed="'+(g.id===selected)+'"><strong>'+escapeHTML(g.name)+'</strong>'+(g.subtitle?'<small>'+escapeHTML(g.subtitle)+'</small>':'')+'<small>'+g.year+' · '+g.platform+'</small></button>').join("");document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));renderPanel()}
function modeSelector(){return game().modes?'<label for="mode">Collection game</label><select id="mode">'+game().modes.map(m=>'<option value="'+m+'" '+(mode===m?'selected':'')+'>'+m+'</option>').join("")+'</select>':''}
function activeMonsters(){return monsters.filter(m=>!game().modes||!m.mode||m.mode===mode)}
function activeRecipes(){return recipes.filter(r=>!game().modes||!r.mode||r.mode===mode)}
function bindMode(){const el=document.querySelector("#mode");if(el)el.addEventListener("change",()=>{mode=el.value;renderPanel()})}
function renderPanel(){const p=document.querySelector("#panel");if(tab==="dex"){p.innerHTML='<h2>'+escapeHTML(game().name)+' · Monster Dex</h2>'+modeSelector()+'<label for="search">Search monsters</label><input id="search" type="search" placeholder="Name, number, or family"><label for="familyFilter">Monster family</label><select id="familyFilter" class="family-filter"><option value="">All families</option>'+[...new Set(activeMonsters().map(m=>m.family).filter(Boolean))].sort().map(f=>'<option value="'+escapeHTML(f)+'" '+(familyFilter===f?'selected':'')+'>'+escapeHTML(f)+'</option>').join('')+'</select><div id="entries"></div>';document.querySelector("#search").addEventListener("input",showEntries);document.querySelector("#familyFilter").addEventListener("change",e=>{familyFilter=e.target.value;showEntries()});bindMode();showEntries()}else{renderFusionPanel()}}
function monsterOptions(value){return '<option value="">Choose a monster</option>'+activeMonsters().slice().sort((a,b)=>a.name.localeCompare(b.name)).map(m=>'<option value="'+escapeHTML(m.id)+'" '+(value===m.id?'selected':'')+'>'+escapeHTML(m.name)+'</option>').join("")}
function byId(id){return activeMonsters().find(m=>m.id===id)}
function parentMatches(spec,m){return !!m&&(spec.kind==="monster"&&spec.id===m.id||spec.kind==="family"&&String(spec.family).toLowerCase()===String(m.family).toLowerCase()||spec.kind==="alternatives"&&spec.options.some(o=>o.id===m.id))}
function parentLabel(spec){if(spec.kind==="monster"){const m=byId(spec.id);return (m?.name||spec.label)+(spec.minimum_plus!=null?' +'+spec.minimum_plus:'')}if(spec.kind==="family")return "Any "+spec.family+" family";if(spec.kind==="alternatives")return spec.options.map(o=>byId(o.id)?.name||o.source_label).join(" / ");return spec.label||"Unknown"}
function parentCandidates(spec){if(spec.kind==="monster")return byId(spec.id)?[byId(spec.id)]:[];if(spec.kind==="family")return activeMonsters().filter(m=>String(m.family).toLowerCase()===String(spec.family).toLowerCase());if(spec.kind==="alternatives")return spec.options.map(o=>byId(o.id)).filter(Boolean);return []}
function availableRecipes(){return activeRecipes().filter(r=>r.breeding_available!==false&&r.offspring?.kind==="monster"&&byId(r.offspring.id)&&["monster","family","alternatives"].includes(r.parent1?.kind)&&["monster","family","alternatives"].includes(r.parent2?.kind))}
function recipeText(r){return parentLabel(r.parent1)+" × "+parentLabel(r.parent2)}
function recipeKey(r){return String(r.source_row_index)+"-"+r.offspring.id}
function renderFusionPanel(){const p=document.querySelector("#panel");const supported=!!importedGames[selected];p.innerHTML='<h2>'+escapeHTML(game().name)+' · Breeding & Fusion</h2>'+modeSelector()+'<p class="muted">Chart-listed combinations from Woodus. Results are not independently verified; family combinations and recipe priority may affect actual gameplay.</p>'+(supported?'<div class="tabs fusion-tabs"><button data-fusion="explore" aria-selected="'+(fusionMode==="explore")+'">Partner Explorer</button><button data-fusion="tree" aria-selected="'+(fusionMode==="tree")+'">Breeding Tree</button></div><div id="fusionWorkspace"></div>':'<div class="empty">Breeding data has not been imported for this game yet.</div>');bindMode();if(!supported)return;document.querySelectorAll("[data-fusion]").forEach(b=>b.addEventListener("click",()=>{fusionMode=b.dataset.fusion;renderFusionPanel()}));renderFusionWorkspace()}
function renderFusionWorkspace(){const el=document.getElementById("fusionWorkspace");if(!el)return;if(fusionMode==="explore"){el.innerHTML='<label for="focusMonster">Select your monster</label><select id="focusMonster">'+monsterOptions(focusMonster)+'</select><label for="partnerMonster">Filter by breeding partner (optional)</label><select id="partnerMonster"><option value="">All possible partners</option>'+monsterOptions(partnerMonster).replace('<option value="">Choose a monster</option>','')+'</select><div id="explorerResults"></div>';document.getElementById("focusMonster").addEventListener("change",e=>{focusMonster=e.target.value;renderExplorer()});document.getElementById("partnerMonster").addEventListener("change",e=>{partnerMonster=e.target.value;renderExplorer()});renderExplorer()}else{el.innerHTML='<label for="targetMonster">Choose the Familiar you want to breed</label><select id="targetMonster">'+monsterOptions(targetMonster)+'</select><div id="treeResults"></div>';document.getElementById("targetMonster").addEventListener("change",e=>{targetMonster=e.target.value;treeChoices={};renderTree()});renderTree()}}
function renderExplorer(){const el=document.getElementById("explorerResults"),focus=byId(focusMonster),partner=byId(partnerMonster);if(!focus){el.innerHTML='<div class="empty">Choose a monster to see chart-listed partners and possible offspring.</div>';return}const matches=[];for(const r of availableRecipes()){const sides=[[r.parent1,r.parent2],[r.parent2,r.parent1]];for(const [first,second] of sides){if(!parentMatches(first,focus))continue;if(partner&&!parentMatches(second,partner))continue;matches.push({r,other:second});break}}const unique=new Map(matches.map(x=>[recipeKey(x.r),x]));el.innerHTML='<p class="muted">'+unique.size+' chart-listed combination(s)'+(partner?' matching this pair':'')+'. A family rule may represent many possible partners.</p>'+(unique.size?[...unique.values()].map(({r,other})=>{const result=byId(r.offspring.id);return '<article class="breed-card"><div class="monster-entry">'+imageMarkup(result.image,"monster-sprite",result.name)+'<div class="details"><strong>'+escapeHTML(result.name)+'</strong><div class="muted">Partner: '+escapeHTML(parentLabel(other))+'</div><small>'+escapeHTML(recipeText(r))+'</small></div></div><a href="'+escapeHTML(r.source)+'" target="_blank" rel="noopener noreferrer">Source chart</a></article>'}).join(''):'<div class="empty">No chart-listed combinations found for this selection. This does not prove breeding is impossible.</div>')}
function renderTree(){const el=document.getElementById("treeResults");if(!targetMonster){el.innerHTML='<div class="empty">Choose a target to explore its breeding requirements.</div>';return}const all=availableRecipes(),lookup=new Map();for(const r of all){const id=r.offspring.id;if(!lookup.has(id))lookup.set(id,[]);lookup.get(id).push(r)}let nodeCount=0;function node(id,depth,seen){const m=byId(id);if(!m)return '<div class="muted">Unknown monster</div>';const title='<span class="monster-entry">'+imageMarkup(m.image,"monster-sprite",m.name)+'<strong>'+escapeHTML(m.name)+'</strong></span>';if(seen.has(id))return '<div class="tree-node">'+title+'<p class="muted">Cycle detected; branch stopped.</p></div>';if(depth>=5||nodeCount++>=90)return '<div class="tree-node">'+title+'<p class="muted">Depth limit reached; expand another route above.</p></div>';const routes=lookup.get(id)||[];if(!routes.length)return '<div class="tree-node">'+title+'<small class="muted">No usable recipe in imported chart; may be obtainable another way.</small></div>';const selectedIndex=Math.min(Number(treeChoices[id]||0),routes.length-1),r=routes[selectedIndex];const choice=routes.length>1?'<label>Breeding route ('+routes.length+' chart entries)</label><select class="route-choice" data-target="'+escapeHTML(id)+'">'+routes.map((route,i)=>'<option value="'+i+'" '+(i===selectedIndex?'selected':'')+'>'+escapeHTML(recipeText(route))+'</option>').join('')+'</select>':'';const next=new Set(seen);next.add(id);const branch=spec=>{const candidates=parentCandidates(spec);if(spec.kind==="family")return '<div class="tree-node"><strong>'+escapeHTML(parentLabel(spec))+'</strong><small class="muted">Family-wide parent; choose any compatible member. Specific results may take precedence.</small></div>';if(!candidates.length)return '<div class="tree-node">'+escapeHTML(parentLabel(spec))+'</div>';if(candidates.length>1)return '<div class="tree-node"><strong>'+escapeHTML(parentLabel(spec))+'</strong><small class="muted">Alternative parents listed above</small></div>';return '<div class="tree-branch">'+(spec.minimum_plus!=null?'<span class="tag">Minimum +'+spec.minimum_plus+'</span>':'')+node(candidates[0].id,depth+1,next)+'</div>'};return '<div class="tree-node">'+title+choice+'<div class="tree-children">'+branch(r.parent1)+branch(r.parent2)+'</div><a href="'+escapeHTML(r.source)+'" target="_blank" rel="noopener noreferrer">Source chart</a></div>'}el.innerHTML='<p class="muted">Select alternate routes where available. Family requirements are shown as groups rather than assuming a specific monster.</p>'+node(targetMonster,0,new Set());el.querySelectorAll(".route-choice").forEach(s=>s.addEventListener("change",e=>{treeChoices[e.target.dataset.target]=Number(e.target.value);renderTree()}))}
function showEntries(){const q=(document.querySelector("#search")?.value||"").toLowerCase();const a=activeMonsters().filter(m=>(!familyFilter||m.family===familyFilter)&&[m.name,m.number,m.family].some(v=>String(v||"").toLowerCase().includes(q)));document.querySelector("#entries").innerHTML=a.length?a.map(m=>'<article class="monster-entry">'+imageMarkup(m.image,'monster-sprite',m.name)+'<div class="details"><h3>'+escapeHTML(m.name)+' <small>#'+escapeHTML(m.number||"?")+'</small></h3><span class="tag">'+familyIcon(m.family)+escapeHTML(m.family||"Unknown family")+'</span></div></article>').join(""):'<div class="empty">No monster entries loaded for this game yet.</div>'}
async function load(){monsters=[];recipes=[];familyFilter="";focusMonster="";partnerMonster="";targetMonster="";treeChoices={};const chosen=selected;try{const source=importedGames[chosen];if(source){const [detailsResponse,imagesResponse,breedingResponse]=await Promise.all([fetch("data/woodus/"+source+"-details.json"),fetch("data/woodus/"+source+"-image-report.json"),fetch("data/woodus/"+source+"-breeding-normalized.json")]);if(!detailsResponse.ok||!imagesResponse.ok)throw Error("Imported dataset unavailable");const details=await detailsResponse.json(),images=await imagesResponse.json();const familyResponse=await fetch("data/woodus/"+source+"-monsters.json");const familyData=familyResponse.ok?await familyResponse.json():{monsters:[]};const families=new Map(familyData.monsters.map(m=>[m.id,m.family||""]));if(chosen!==selected)return;monsters=details.records.map((m,i)=>({id:m.id,name:m.name,number:m.book_number||i+1,family:families.get(m.id)||"",image:images.images?.[m.id]?.local_path||"",japanese_name:m.japanese_name}));recipes=breedingResponse.ok?(await breedingResponse.json()).rows||[]:[];}else{const r=await fetch("data/"+chosen+".json");if(r.ok){const d=await r.json();if(chosen!==selected)return;monsters=d.monsters||[];recipes=d.recipes||[]}}}catch(e){console.warn("Unable to load game data",e)}if(chosen===selected)renderPanel()}
document.querySelector("#games").addEventListener("click",e=>{const b=e.target.closest("[data-game]");if(b){selected=b.dataset.game;mode="DQM1";render();load()}});
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;render()}});
render();Promise.all([loadBranding(),load()]).then(()=>renderPanel());
</script></body></html>
