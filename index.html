<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DQM Dex & Fusion</title><meta name="theme-color" content="#10182a">
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c1220;color:#f0f4ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#263b64,#0c1220 55%);min-height:100vh}header,main{max-width:1200px;margin:auto;padding:22px}header{text-align:center}h1{margin:12px 0 5px;font-size:clamp(1.6rem,4vw,2.8rem)}p{color:#aebcda}.games{display:flex;gap:12px;overflow:auto;padding:14px 4px 24px;scroll-snap-type:x mandatory}.game{flex:0 0 175px;min-height:110px;border:1px solid #45587d;border-radius:14px;background:#17233a;color:#dce6ff;padding:15px;cursor:pointer;scroll-snap-align:start}.game[aria-pressed=true]{background:#30466d;border-color:#ffd676;color:white;box-shadow:0 0 0 2px #ffd67633}.game strong{display:block;font-size:.95rem}.game small{display:block;margin-top:8px;color:#b4c2df}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.tabs button,.action{background:#1c2c4b;border:1px solid #526991;border-radius:9px;padding:12px 20px;color:white;cursor:pointer}.tabs button[aria-selected=true]{background:#385a8e;border-color:#ffd676}.panel{background:#141f34;border:1px solid #334765;border-radius:16px;padding:24px;min-height:300px}label{display:block;margin:15px 0 6px}input,select{width:100%;background:#0d1729;color:white;border:1px solid #4b638a;border-radius:8px;padding:12px}.fusion{display:grid;grid-template-columns:1fr 1fr;gap:18px}.fusion .result{grid-column:1/-1;border:1px dashed #526991;padding:18px;border-radius:12px;text-align:center}.muted{color:#aebcda}.tag{display:inline-block;background:#293e5e;padding:4px 9px;border-radius:8px;margin:4px}.empty{text-align:center;padding:45px 10px;color:#c1cce2}@media(max-width:600px){.fusion{grid-template-columns:1fr}.fusion .result{grid-column:auto}.game{flex-basis:145px}header,main{padding:14px}}
.game small+small{margin-top:3px}.game{min-height:125px}#entries article{border-bottom:1px solid #334765;padding:12px 0}#entries article h3{margin:0 0 7px}#entries article small{color:#b9c7e4;font-size:.8em}.games{flex-wrap:wrap;overflow:visible}.game{flex:1 1 160px;max-width:230px}.panel h2{margin-top:0}.game-logo{width:100%;height:54px;object-fit:contain;display:block;margin:0 auto 8px}.monster-entry{display:flex;align-items:center;gap:12px}.monster-sprite{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;flex:none}.family-icon{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:5px}.family-filter{max-width:260px}.monster-entry .details{min-width:0;flex:1}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffd676;outline-offset:3px}@media(max-width:600px){.games{flex-wrap:nowrap;overflow-x:auto}.game{flex:0 0 155px}}</style></head><body>
<header><h1>Dragon Quest Monsters Dex & Fusion</h1><p>Explore monsters and game-specific breeding or synthesis recipes.</p></header>
<main><nav class="games" id="games" aria-label="Select game"></nav><nav class="tabs" aria-label="Tools"><button data-tab="dex" aria-selected="true">Dex</button><button data-tab="fusion" aria-selected="false">Fusion</button></nav><section class="panel" id="panel" aria-live="polite"></section></main>
<script>
const games=[
{id:"dwm",name:"Dragon Warrior Monsters",year:1998,platform:"GBC",group:"Original"},
{id:"dwm2",name:"Dragon Warrior Monsters 2",subtitle:"Cobi's Journey / Tara's Adventure",year:2001,platform:"GBC",group:"Original"},
{id:"dqm12",name:"Dragon Quest Monsters 1+2",subtitle:"Terry / Cobi & Tara",year:2002,platform:"PS1",group:"Original",modes:["DQM1","DQM2"]},
{id:"caravan",name:"Caravan Heart",year:2003,platform:"GBA",group:"Caravan Heart"},
{id:"joker",name:"Joker",year:2006,platform:"DS",group:"Joker"},
{id:"joker2",name:"Joker 2",year:2010,platform:"DS",group:"Joker"},
{id:"joker2pro",name:"Joker 2 Professional",year:2011,platform:"DS",group:"Joker"},
{id:"terry3d",name:"Terry's Wonderland 3D",year:2012,platform:"3DS",group:"Remakes"},
{id:"dqm2-3d",name:"Iru & Luca's Marvelous Mysterious Key",year:2014,platform:"3DS",group:"Remakes"},
{id:"joker3",name:"Joker 3",year:2016,platform:"3DS",group:"Joker"},
{id:"joker3pro",name:"Joker 3 Professional",year:2017,platform:"3DS",group:"Joker"},
{id:"darkprince",name:"The Dark Prince",year:2023,platform:"Switch / PC",group:"Modern"}];
let selected=games[0].id,tab="dex",monsters=[],recipes=[],mode="DQM1",familyFilter="";
const importedGames={dwm:"dwm1gbc",dwm2:"dwm2gbc"};
const logoManifest="assets/branding/manifest.json";let branding={games:{},families:{}};
async function loadBranding(){try{const r=await fetch(logoManifest);if(r.ok)branding=await r.json()}catch(e){}render()}
function imageMarkup(src,cls,alt){return src?'<img class="'+cls+'" src="'+escapeHTML(src)+'" alt="'+escapeHTML(alt)+'" loading="lazy" onerror="this.hidden=true">':''}
function familyIcon(family){const key=String(family||"").toLowerCase();const path=branding.families?.[importedGames[selected]]?.[key];return imageMarkup(path,"family-icon",family+" family")}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function game(){return games.find(g=>g.id===selected)}
function render(){document.querySelector("#games").innerHTML=games.map(g=>'<button class="game" data-game="'+g.id+'" aria-pressed="'+(g.id===selected)+'"><strong>'+escapeHTML(g.name)+'</strong>'+(g.subtitle?'<small>'+escapeHTML(g.subtitle)+'</small>':'')+'<small>'+g.year+' · '+g.platform+'</small></button>').join("");document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));renderPanel()}
function modeSelector(){return game().modes?'<label for="mode">Collection game</label><select id="mode">'+game().modes.map(m=>'<option value="'+m+'" '+(mode===m?'selected':'')+'>'+m+'</option>').join("")+'</select>':''}
function activeMonsters(){return monsters.filter(m=>!game().modes||!m.mode||m.mode===mode)}
function activeRecipes(){return recipes.filter(r=>!game().modes||!r.mode||r.mode===mode)}
function bindMode(){const el=document.querySelector("#mode");if(el)el.addEventListener("change",()=>{mode=el.value;renderPanel()})}
function renderPanel(){const p=document.querySelector("#panel");if(tab==="dex"){p.innerHTML='<h2>'+escapeHTML(game().name)+' · Monster Dex</h2>'+modeSelector()+'<label for="search">Search monsters</label><input id="search" type="search" placeholder="Name, number, or family"><label for="familyFilter">Monster family</label><select id="familyFilter" class="family-filter"><option value="">All families</option>'+[...new Set(activeMonsters().map(m=>m.family).filter(Boolean))].sort().map(f=>'<option value="'+escapeHTML(f)+'" '+(familyFilter===f?'selected':'')+'>'+escapeHTML(f)+'</option>').join('')+'</select><div id="entries"></div>';document.querySelector("#search").addEventListener("input",showEntries);document.querySelector("#familyFilter").addEventListener("change",e=>{familyFilter=e.target.value;showEntries()});bindMode();showEntries()}else{p.innerHTML='<h2>'+escapeHTML(game().name)+' · Fusion</h2>'+modeSelector()+'<p>Breeding and synthesis combinations are scoped to this game.</p><div class="fusion"><div><label for="parentA">First parent</label><select id="parentA"></select></div><div><label for="parentB">Second parent</label><select id="parentB"></select></div><div class="result" id="result">Select two parents to see possible results.</div></div>';bindMode();const opts='<option value="">Choose a monster</option>'+activeMonsters().map(m=>'<option value="'+escapeHTML(m.id)+'">'+escapeHTML(m.name)+'</option>').join("");["parentA","parentB"].forEach(id=>{const el=document.getElementById(id);el.innerHTML=opts;el.addEventListener("change",showFusion)});showFusion()}}
function showEntries(){const q=(document.querySelector("#search")?.value||"").toLowerCase();const a=activeMonsters().filter(m=>(!familyFilter||m.family===familyFilter)&&[m.name,m.number,m.family].some(v=>String(v||"").toLowerCase().includes(q)));document.querySelector("#entries").innerHTML=a.length?a.map(m=>'<article class="monster-entry">'+imageMarkup(m.image,'monster-sprite',m.name)+'<div class="details"><h3>'+escapeHTML(m.name)+' <small>#'+escapeHTML(m.number||"?")+'</small></h3><span class="tag">'+familyIcon(m.family)+escapeHTML(m.family||"Unknown family")+'</span></div></article>').join(""):'<div class="empty">No monster entries loaded for this game yet.</div>'}
function showFusion(){const a=document.getElementById("parentA").value,b=document.getElementById("parentB").value;const r=document.getElementById("result");if(!a||!b){r.textContent=monsters.length?"Select two parents to see possible results.":"Fusion recipes have not been populated for this game yet.";return}const matches=activeRecipes().filter(x=>(x.parent1===a&&x.parent2===b)||(x.parent1===b&&x.parent2===a));r.textContent=matches.length?matches.map(x=>monsters.find(m=>m.id===x.result)?.name||x.result).join(" / "):"No verified recipe available for this pair."}
async function load(){monsters=[];recipes=[];familyFilter="";const chosen=selected;try{const source=importedGames[chosen];if(source){const [detailsResponse,imagesResponse]=await Promise.all([fetch("data/woodus/"+source+"-details.json"),fetch("data/woodus/"+source+"-image-report.json")]);if(!detailsResponse.ok||!imagesResponse.ok)throw Error("Imported dataset unavailable");const details=await detailsResponse.json(),images=await imagesResponse.json();const familyResponse=await fetch("data/woodus/"+source+"-monsters.json");const familyData=familyResponse.ok?await familyResponse.json():{monsters:[]};const families=new Map(familyData.monsters.map(m=>[m.id,m.family||""]));if(chosen!==selected)return;monsters=details.records.map((m,i)=>({id:m.id,name:m.name,number:m.book_number||i+1,family:families.get(m.id)||"",image:images.images?.[m.id]?.local_path||"",japanese_name:m.japanese_name}));if(chosen==="dwm2"){const extraResponse=await fetch("data/woodus/dwm2gbc-supplemental-monsters.json");if(extraResponse.ok){const extra=await extraResponse.json();if(chosen!==selected)return;const ids=new Set(monsters.map(m=>m.id));monsters.push(...extra.monsters.filter(m=>!ids.has(m.id)).map(m=>({id:m.id,name:m.name,number:m.number||"—",family:m.family||"Boss",image:m.image||"",supplemental:true})));}}}else{const r=await fetch("data/"+chosen+".json");if(r.ok){const d=await r.json();if(chosen!==selected)return;monsters=d.monsters||[];recipes=d.recipes||[]}}}catch(e){console.warn("Unable to load game data",e)}if(chosen===selected)renderPanel()}
document.querySelector("#games").addEventListener("click",e=>{const b=e.target.closest("[data-game]");if(b){selected=b.dataset.game;mode="DQM1";render();load()}});
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;render()}});
render();Promise.all([loadBranding(),load()]).then(()=>renderPanel());
</script></body></html>
