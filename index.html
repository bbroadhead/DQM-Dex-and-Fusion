<header><h1>Dragon Quest Monsters Roster & Fusion</h1></header>
<main><nav class="games" id="games" aria-label="Select game"></nav><nav class="tabs" aria-label="Tools"><button data-tab="roster" aria-selected="true">Roster</button><button data-tab="fusion" aria-selected="false">Fusion</button></nav><section class="panel" id="panel" aria-live="polite"></section></main>
<script>
const games=[
{id:"dwm",name:"Dragon Warrior Monsters",year:1998,platform:"GBC",group:"Original"},
{id:"dwm2",name:"Dragon Warrior Monsters 2",subtitle:"Cobi's Journey / Tara's Adventure",year:2001,platform:"GBC",group:"Original"},
{id:"dqm12",name:"Dragon Quest Monsters 1+2",subtitle:"Terry / Cobi & Tara",year:2002,platform:"PS1",group:"Original",modes:["DQM1","DQM2"]},
{id:"caravan",name:"Caravan Heart",year:2003,platform:"GBA",group:"Caravan Heart"},
{id:"joker",name:"Joker",year:2006,platform:"DS",group:"Joker"},
{id:"joker2",name:"Joker 2",year:2010,platform:"DS",group:"Joker"},
{id:"joker2pro",name:"Joker 2 Professional",year:2011,platform:"DS",group:"Joker"},
{id:"terry3d",name:"Terry's Wonderland 3D",year:2012,platform:"3DS",group:"Remakes"},
{id:"dqm2-3d",name:"Iru & Luca's Marvelous Mysterious Key",year:2014,platform:"3DS",group:"Remakes"},
{id:"joker3",name:"Joker 3",year:2016,platform:"3DS",group:"Joker"},
{id:"joker3pro",name:"Joker 3 Professional",year:2017,platform:"3DS",group:"Joker"},
{id:"darkprince",name:"The Dark Prince",year:2023,platform:"Switch / PC",group:"Modern"}];
let selected=games[0].id,tab="roster",monsters=[],recipes=[],mode="DQM1",familyFilter="",fusionMode="explore",focusMonster="",partnerMonster="",targetMonster="",treeChoices={},expandedTree={},openFamilies={};
const importedGames={dwm:"dwm1gbc",dwm2:"dwm2gbc"};
const logoManifest="assets/branding/manifest.json";let branding={games:{},families:{}};
async function loadBranding(){try{const r=await fetch(logoManifest);if(r.ok)branding=await r.json()}catch(e){}render()}
function imageMarkup(src,cls,alt){return src?'<img class="'+cls+'" src="'+escapeHTML(src)+'" alt="'+escapeHTML(alt)+'" loading="lazy" onerror="this.hidden=true">':''}
function familyIcon(family){const key=String(family||"").toLowerCase();const path=branding.families?.[importedGames[selected]]?.[key];return imageMarkup(path,"family-icon",family+" family")}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function game(){return games.find(g=>g.id===selected)}
function render(){document.body.dataset.theme=selected;document.querySelector("#games").innerHTML=games.map(g=>'<button class="game" data-game="'+g.id+'" aria-pressed="'+(g.id===selected)+'">'+(branding.games?.[g.id]?imageMarkup(branding.games[g.id],"game-logo",g.name+" logo"):'<strong>'+escapeHTML(g.name)+'</strong>')+(g.subtitle?'<small>'+escapeHTML(g.subtitle)+'</small>':'')+'<small>'+g.year+' · '+g.platform+'</small></button>').join("");document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));renderPanel()}
function modeSelector(){return game().modes?'<label for="mode">Collection game</label><select id="mode">'+game().modes.map(m=>'<option value="'+m+'" '+(mode===m?'selected':'')+'>'+m+'</option>').join("")+'</select>':''}
function activeMonsters(){return monsters.filter(m=>!game().modes||!m.mode||m.mode===mode)}
function activeRecipes(){return recipes.filter(r=>!game().modes||!r.mode||r.mode===mode)}
function bindMode(){const el=document.querySelector("#mode");if(el)el.addEventListener("change",()=>{mode=el.value;renderPanel()})}
function renderPanel(){const p=document.querySelector("#panel");if(tab==="roster"){p.innerHTML='<h2>'+escapeHTML(game().name)+' · Monster Roster</h2>'+modeSelector()+'<label for="search">Search monsters</label><input id="search" type="search" placeholder="Name, number, or family"><label for="familyFilter">Monster family</label><select id="familyFilter" class="family-filter"><option value="">All families</option>'+[...new Set(activeMonsters().map(m=>m.family).filter(Boolean))].sort().map(f=>'<option value="'+escapeHTML(f)+'" '+(familyFilter===f?'selected':'')+'>'+escapeHTML(f)+'</option>').join('')+'</select><div id="entries"></div>';document.querySelector("#search").addEventListener("input",showEntries);document.querySelector("#familyFilter").addEventListener("change",e=>{familyFilter=e.target.value;showEntries()});bindMode();showEntries()}else{renderFusionPanel()}}
function monsterOptions(value){return '<option value="">Choose a monster</option>'+activeMonsters().slice().sort((a,b)=>a.name.localeCompare(b.name)).map(m=>'<option value="'+escapeHTML(m.id)+'" '+(value===m.id?'selected':'')+'>'+escapeHTML(m.name)+'</option>').join("")}
function byId(id){return activeMonsters().find(m=>m.id===id)}
function parentMatches(spec,m){return !!m&&(spec.kind==="monster"&&spec.id===m.id||spec.kind==="family"&&String(spec.family).toLowerCase()===String(m.family).toLowerCase()||spec.kind==="alternatives"&&spec.options.some(o=>o.id===m.id))}
function parentLabel(spec){if(spec.kind==="monster"){const m=byId(spec.id);return (m?.name||spec.label)+(spec.minimum_plus!=null?' +'+spec.minimum_plus:'')}if(spec.kind==="family")return "Any "+spec.family+" family";if(spec.kind==="alternatives")return spec.options.map(o=>byId(o.id)?.name||o.source_label).join(" / ");return spec.label||"Unknown"}
function parentCandidates(spec){if(spec.kind==="monster")return byId(spec.id)?[byId(spec.id)]:[];if(spec.kind==="family")return activeMonsters().filter(m=>String(m.family).toLowerCase()===String(spec.family).toLowerCase());if(spec.kind==="alternatives")return spec.options.map(o=>byId(o.id)).filter(Boolean);return []}
function availableRecipes(){return activeRecipes().filter(r=>r.breeding_available!==false&&r.offspring?.kind==="monster"&&byId(r.offspring.id)&&["monster","family","alternatives"].includes(r.parent1?.kind)&&["monster","family","alternatives"].includes(r.parent2?.kind))}
function recipeText(r){return parentLabel(r.parent1)+" × "+parentLabel(r.parent2)}
function recipeKey(r){return String(r.source_row_index)+"-"+r.offspring.id}
function renderFusionPanel(){const p=document.querySelector("#panel");const supported=!!importedGames[selected];p.innerHTML='<h2>'+escapeHTML(game().name)+' · Fusion & Fusion</h2>'+modeSelector()+''+(supported?'<div class="tabs fusion-tabs"><button data-fusion="explore" aria-selected="'+(fusionMode==="explore")+'">Partner Explorer</button><button data-fusion="tree" aria-selected="'+(fusionMode==="tree")+'">Fusion Tree</button></div><div id="fusionWorkspace"></div>':'<div class="empty">Fusion data has not been imported for this game yet.</div>');bindMode();if(!supported)return;document.querySelectorAll("[data-fusion]").forEach(b=>b.addEventListener("click",()=>{fusionMode=b.dataset.fusion;renderFusionPanel()}));renderFusionWorkspace()}
function renderFusionWorkspace(){const el=document.getElementById("fusionWorkspace");if(!el)return;if(fusionMode==="explore"){el.innerHTML='<label for="focusMonster">Select your monster</label><select id="focusMonster">'+monsterOptions(focusMonster)+'</select><label for="partnerMonster">Filter by fusion partner (optional)</label><select id="partnerMonster"><option value="">All possible partners</option>'+monsterOptions(partnerMonster).replace('<option value="">Choose a monster</option>','')+'</select><div id="explorerResults"></div>';document.getElementById("focusMonster").addEventListener("change",e=>{focusMonster=e.target.value;renderExplorer()});document.getElementById("partnerMonster").addEventListener("change",e=>{partnerMonster=e.target.value;renderExplorer()});renderExplorer()}else{el.innerHTML='<label for="targetMonster">Choose the Monster you want to breed</label><select id="targetMonster">'+monsterOptions(targetMonster)+'</select><div id="treeResults"></div>';document.getElementById("targetMonster").addEventListener("change",e=>{targetMonster=e.target.value;treeChoices={};expandedTree={};renderTree()});renderTree()}}
function renderExplorer(){const el=document.getElementById("explorerResults"),focus=byId(focusMonster),partner=byId(partnerMonster);if(!focus){el.innerHTML='<div class="empty">Choose a monster to see chart-listed partners and possible offspring.</div>';return}const all=availableRecipes(),matches=[];for(const r of all){for(const [first,second] of [[r.parent1,r.parent2],[r.parent2,r.parent1]]){if(!parentMatches(first,focus))continue;if(partner&&!parentMatches(second,partner))continue;matches.push({r,other:second});break}}const unique=new Map(matches.map(x=>[recipeKey(x.r),x]));const entries=[...unique.values()].map(x=>({...x,exclusive:all.filter(r=>r.offspring.id===x.r.offspring.id).every(r=>[r.parent1,r.parent2].some(p=>p.kind==="monster"&&p.id===focus.id))})).sort((a,b)=>Number(b.exclusive)-Number(a.exclusive)||byId(a.r.offspring.id).name.localeCompare(byId(b.r.offspring.id).name));el.innerHTML='<p class="muted">'+entries.length+' chart-listed combination(s). <span class="exclusive-star">★</span> means every imported recipe explicitly requires your selected monster; family-wide and alternative-parent recipes do not count as exclusive.</p>'+(entries.length?entries.map(({r,other,exclusive})=>{const result=byId(r.offspring.id);return '<article class="breed-card"><div class="monster-entry">'+imageMarkup(result.image,"monster-sprite",result.name)+'<div class="details"><strong>'+(exclusive?'<span class="exclusive-star" title="Requires selected monster in all imported recipes">★ </span>':'')+escapeHTML(result.name)+'</strong><div class="muted">Partner: '+escapeHTML(parentLabel(other))+'</div><small>'+escapeHTML(recipeText(r))+'</small></div></div><a href="'+escapeHTML(r.source)+'" target="_blank" rel="noopener noreferrer">Source chart</a></article>'}).join(''):'<div class="empty">No chart-listed combinations found. This does not prove fusion is impossible.</div>')}
function renderTree(){const el=document.getElementById("treeResults");if(!targetMonster){el.innerHTML='<div class="empty">Choose a target to explore its fusion requirements.</div>';return}const lookup=new Map();for(const r of availableRecipes()){if(!lookup.has(r.offspring.id))lookup.set(r.offspring.id,[]);lookup.get(r.offspring.id).push(r)}let count=0;function node(id,path,seen,depth){const m=byId(id);if(!m)return '';const routes=lookup.get(id)||[],open=!!expandedTree[path],cycle=seen.has(id),limited=depth>=8||count++>100;const title='<button class="tree-monster" data-expand="'+escapeHTML(path)+'" aria-expanded="'+open+'" '+(!routes.length||cycle||limited?'disabled':'')+'>'+imageMarkup(m.image,"monster-sprite",m.name)+'<span><strong>'+escapeHTML(m.name)+'</strong><small>'+(cycle?'Cycle':limited?'Limit reached':routes.length?(open?'− Collapse':'+ Expand'):'No chart recipe')+'</small></span></button>';if(!open||cycle||limited||!routes.length)return '<div class="lineage">'+title+'</div>';const index=Math.min(Number(treeChoices[path]||0),routes.length-1),r=routes[index],next=new Set(seen);next.add(id);const routeSelect=routes.length>1?'<label class="tree-route-label">Recipe <select class="route-choice" data-path="'+escapeHTML(path)+'">'+routes.map((x,i)=>'<option value="'+i+'" '+(i===index?'selected':'')+'>'+escapeHTML(recipeText(x))+'</option>').join('')+'</select></label>':'';function branch(spec,side){const candidates=parentCandidates(spec),key=path+"/"+side;const needsChoice=spec.kind==="family"||spec.kind==="alternatives";const chosen=treeChoices[key]||"";const picked=needsChoice?candidates.find(m=>m.id===chosen):candidates[0];const selector=needsChoice?'<label class="tree-route-label">'+escapeHTML(parentLabel(spec))+'<select class="parent-choice" data-path="'+escapeHTML(key)+'"><option value="">Choose a parent</option>'+candidates.map(m=>'<option value="'+escapeHTML(m.id)+'" '+(chosen===m.id?'selected':'')+'>'+escapeHTML(m.name)+'</option>').join('')+'</select></label>':'';return '<div class="lineage-parent">'+(selector||(!picked?'<span class="muted">'+escapeHTML(parentLabel(spec))+'</span>':''))+(spec.minimum_plus!=null?'<span class="tag">Minimum +'+spec.minimum_plus+'</span>':'')+(picked?node(picked.id,key,next,depth+1):'<span class="tree-placeholder">Select to expand this branch</span>')+'</div>'}return '<div class="lineage">'+title+routeSelect+'<div class="lineage-parents">'+branch(r.parent1,"a")+branch(r.parent2,"b")+'</div><a class="tree-source" href="'+escapeHTML(r.source)+'" target="_blank" rel="noopener noreferrer">Source chart</a></div>'}el.innerHTML='<div class="tree-scroll"><div class="lineage-root">'+node(targetMonster,"root",new Set(),0)+'</div></div>';el.querySelectorAll("[data-expand]").forEach(b=>b.addEventListener("click",()=>{expandedTree[b.dataset.expand]=!expandedTree[b.dataset.expand];renderTree()}));el.querySelectorAll(".route-choice").forEach(s=>s.addEventListener("change",e=>{treeChoices[e.target.dataset.path]=Number(e.target.value);renderTree()}));el.querySelectorAll(".parent-choice").forEach(s=>s.addEventListener("change",e=>{treeChoices[e.target.dataset.path]=e.target.value;expandedTree[e.target.dataset.path]=false;renderTree()}))}
function showEntries(){const q=(document.querySelector("#search")?.value||"").trim().toLowerCase();const a=activeMonsters().filter(m=>(!familyFilter||m.family===familyFilter)&&[m.name,m.number,m.family].some(v=>String(v||"").toLowerCase().includes(q)));const groups=new Map();for(const m of a){const family=m.family||"Unknown";if(!groups.has(family))groups.set(family,[]);groups.get(family).push(m)}document.querySelector("#entries").innerHTML=a.length?[...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([family,items])=>{const open=q.length>0||openFamilies[family]===true;return '<details class="family-section" data-family="'+escapeHTML(family)+'" '+(open?'open':'')+'><summary>'+familyIcon(family)+'<strong>'+escapeHTML(family)+' family</strong><span class="family-count">'+items.length+' monsters</span></summary><div class="monster-grid">'+items.map(m=>'<article class="monster-entry monster-tile">'+imageMarkup(m.image,'monster-sprite',m.name)+'<div class="details"><h3>'+escapeHTML(m.name)+' <small>#'+escapeHTML(m.number||"?")+'</small></h3><span class="tag">'+familyIcon(m.family)+escapeHTML(m.family||"Unknown family")+'</span></div></article>').join("")+'</div></details>'}).join(""):'<div class="empty">No monsters match your search.</div>';document.querySelectorAll(".family-section").forEach(el=>el.addEventListener("toggle",()=>{if(!q)openFamilies[el.dataset.family]=el.open}))}
async function load(){monsters=[];recipes=[];familyFilter="";focusMonster="";partnerMonster="";targetMonster="";treeChoices={};expandedTree={};openFamilies={};const chosen=selected;try{const source=importedGames[chosen];if(source){const [detailsResponse,imagesResponse,breedingResponse]=await Promise.all([fetch("data/woodus/"+source+"-details.json"),fetch("data/woodus/"+source+"-image-report.json"),fetch("data/woodus/"+source+"-fusion-normalized.json")]);if(!detailsResponse.ok||!imagesResponse.ok)throw Error("Imported dataset unavailable");const details=await detailsResponse.json(),images=await imagesResponse.json();const familyResponse=await fetch("data/woodus/"+source+"-monsters.json");const familyData=familyResponse.ok?await familyResponse.json():{monsters:[]};const families=new Map(familyData.monsters.map(m=>[m.id,m.family||""]));if(chosen!==selected)return;monsters=details.records.map((m,i)=>({id:m.id,name:m.name,number:m.book_number||i+1,family:families.get(m.id)||"",image:images.images?.[m.id]?.local_path||"",japanese_name:m.japanese_name}));recipes=breedingResponse.ok?(await breedingResponse.json()).rows||[]:[];}else{const r=await fetch("data/"+chosen+".json");if(r.ok){const d=await r.json();if(chosen!==selected)return;monsters=d.monsters||[];recipes=d.recipes||[]}}}catch(e){console.warn("Unable to load game data",e)}if(chosen===selected)renderPanel()}
document.querySelector("#games").addEventListener("click",e=>{const b=e.target.closest("[data-game]");if(b){selected=b.dataset.game;mode="DQM1";render();load()}});
document.querySelector("main > .tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;render()}});
render();Promise.all([loadBranding(),load()]).then(()=>renderPanel());
</script></body></html>
